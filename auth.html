<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="orange">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshFab — Sign in</title>
    <script>
        // Тема применяется до загрузки стилей, чтобы страница не мигала
        document.documentElement.dataset.theme = localStorage.getItem('mf_theme') || 'light';
        document.documentElement.dataset.accent = localStorage.getItem('mf_accent') || 'orange';
        const mfBg0 = localStorage.getItem('mf_bg');
        if (mfBg0 && mfBg0 !== 'solid') document.documentElement.dataset.bg = mfBg0;
    </script>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <script src="i18n.js?v=8"></script>
</head>
<body>

    <!-- Пикселизация вместо гаус-размытия -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <filter id="mf-pixel" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feFlood x="3" y="3" width="2" height="2"/>
            <feComposite width="8" height="8"/>
            <feTile result="tile"/>
            <feComposite in="SourceGraphic" in2="tile" operator="in"/>
            <feMorphology operator="dilate" radius="4"/>
        </filter>
    </svg>

    <header class="topbar">
        <a class="logo" href="index.html">
            <svg class="logo-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <polygon points="10,54 10,14 24,34 32,20 40,34 54,14 54,54 44,54 44,32 38,42 32,36 26,42 20,32 20,54" fill="var(--accent)" opacity="0.35"/>
                <polygon points="10,14 24,34 10,40" fill="var(--accent)" opacity="0.9"/>
                <polygon points="24,34 32,20 32,36 26,42" fill="var(--accent)" opacity="0.65"/>
                <polygon points="32,20 40,34 32,36" fill="var(--accent)" opacity="0.9"/>
                <polygon points="40,34 54,14 54,40" fill="var(--accent)" opacity="0.65"/>
            </svg>
            <span class="logo-text">MeshFab</span>
        </a>
    </header>

    <main class="page-wrap">
        <div class="modal glass">
            <a class="back-link" href="index.html">← <span data-i18n="auth.back">Back to models</span></a>
            <h3 class="page-title" id="auth-title">Sign in to MeshFab</h3>

            <div class="auth-switch">
                <button class="glass-btn active" data-auth="login" data-i18n="auth.tab_login" type="button">Sign in</button>
                <button class="glass-btn" data-auth="register" data-i18n="auth.tab_register" type="button">Sign up</button>
            </div>

            <form id="auth-login-form">
                <input type="text" id="login-user" data-i18n-ph="auth.user_ph" placeholder="Username" maxlength="24" autocomplete="username" required>
                <input type="password" id="login-pass" data-i18n-ph="auth.pass_ph" placeholder="Password" autocomplete="current-password" required>
                <button class="btn primary wide" data-i18n="auth.tab_login" type="submit">Sign in</button>
            </form>

            <!-- Регистрация без мейла: ник + пароль (PBKDF2-хеш, открытым текстом не хранится) -->
            <form id="auth-reg-form" class="hidden">
                <input type="text" id="reg-user" data-i18n-ph="auth.user_new_ph" placeholder="Pick a username (3–24)" maxlength="24" autocomplete="username" required>
                <input type="password" id="reg-pass" data-i18n-ph="auth.pass_new_ph" placeholder="Pick a password (min 8)" minlength="8" autocomplete="new-password" required>
                <input type="password" id="reg-pass2" data-i18n-ph="auth.pass2_ph" placeholder="Repeat password" minlength="8" autocomplete="new-password" required>
                <button class="btn primary wide" data-i18n="auth.tab_register" type="submit">Create account</button>
            </form>

            <p class="hint" style="margin-top:1rem" data-i18n="auth.local_note">
                Accounts live only in your browser — nothing is sent anywhere.
            </p>
        </div>
    </main>

    <div id="toast"></div>

    <script src="auth.js?v=8"></script>
</body>
</html>
