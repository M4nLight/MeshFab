<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Иконка MeshFab: буква «M», собранная как low-poly модель.
         Файл используется как favicon; в шапке сайта та же иконка
         вставлена инлайн (чтобы менять цвет под акцент из Sttng). -->
    <!-- Фон-силуэт буквы M -->
    <polygon points="10,54 10,14 24,34 32,20 40,34 54,14 54,54 44,54 44,32 38,42 32,36 26,42 20,32 20,54" fill="#1caad9" opacity="0.35"/>
    <!-- Грани (низкополигональные фасетки) -->
    <polygon points="10,14 24,34 10,40" fill="#1caad9" opacity="0.9"/>
    <polygon points="24,34 32,20 32,36 26,42" fill="#1caad9" opacity="0.65"/>
    <polygon points="32,20 40,34 32,36" fill="#1caad9" opacity="0.9"/>
    <polygon points="40,34 54,14 54,40" fill="#1caad9" opacity="0.65"/>
</svg>
